<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f4ed" />
    <title>Church Calendar</title>
  </head>
  <body>
    <main class="calendar-shell">
      <nav id="calendar-filters" class="calendar-filters" aria-label="Calendar filters"></nav>
      <nav class="calendar-views" aria-label="Calendar view">
        <button class="calendar-view-button" type="button" data-calendar-view="dayGridMonth" aria-pressed="true">
          Month
        </button>
        <button class="calendar-view-button" type="button" data-calendar-view="listMonth" aria-pressed="false">
          List
        </button>
      </nav>
      <div id="calendar" aria-label="Church events calendar"></div>
      <div id="calendar-status" class="calendar-status" role="status" aria-live="polite"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
