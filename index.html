<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f4ed" />
    <title>Church Calendar</title>
  </head>
  <body>
    <main class="calendar-shell">
      <nav id="calendar-filters" class="calendar-filters" aria-label="Calendar filters"></nav>
      <nav class="calendar-views" aria-label="Calendar view">
        <button class="calendar-view-button" type="button" data-calendar-view="dayGridMonth" aria-pressed="true">
          Month
        </button>
        <button class="calendar-view-button" type="button" data-calendar-view="listMonth" aria-pressed="false">
          List
        </button>
      </nav>
      <div id="calendar" aria-label="Church events calendar"></div>
      <div id="calendar-status" class="calendar-status" role="status" aria-live="polite"></div>
    </main>
    <dialog id="event-dialog" class="event-dialog" aria-labelledby="event-dialog-title">
      <button id="event-dialog-close" class="event-dialog-close" type="button" aria-label="Close event details">
        <span aria-hidden="true">&times;</span>
      </button>
      <div id="event-dialog-source" class="event-dialog-source"></div>
      <h2 id="event-dialog-title" class="event-dialog-title"></h2>
      <dl id="event-dialog-details" class="event-dialog-details"></dl>
      <div id="event-dialog-description" class="event-dialog-description"></div>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
